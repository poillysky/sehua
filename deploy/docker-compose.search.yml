# next-web + scrape-web 合一容器（与主栈 docker-compose.nas.yml 分开）
#
# 目录示例：/vol1/1000/Docker/sehuatang/
#   docker-compose.search.yml
#   data/search/
#   data/search-cache/
#   data/scrape-covers/
#   data/scrape-meta/
#   data/scrape-config/
#
# 前提：主栈已 up，postgres 在同一 Docker 网络里（默认 sehuatang-network）。
# 资源库若是独立实例，把 POSTGRES_* 改成实际可达地址（如 172.17.0.1:5435）。
#
# 启动:
#   docker compose -f docker-compose.search.yml pull
#   docker compose -f docker-compose.search.yml up -d
# 访问: http://NAS_IP:3010  刮削: http://NAS_IP:9209/health
#
# 若主栈网络名不是 sehuatang-network，改下方 networks.default.name。
#
# 升级自双容器：旧 sehuatang-scrape 会被 --remove-orphans 清掉；封面卷路径不变。

name: sehuatang-search

services:
  search:
    image: poillysky/sehuatang-search:1.2.7
    container_name: sehuatang-search
    restart: always
    ports:
      - "3010:3000"
      - "9209:9209"
    environment:
      TZ: Asia/Shanghai
      PORT: "3000"
      SCRAPE_PORT: "9209"
      COVERS_DIR: /data/covers
      META_DIR: /data/meta
      SCRAPE_CONFIG_DIR: /data/config
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ed2k
      # 服务名 postgres 须能在下方 external 网络里解析到主栈库
      POSTGRES_DB_URL: postgres://postgres:postgres@postgres:5432/ed2k
      TRANSLATE_API_URL: ""
      TRANSLATE_FALLBACK: "1"
      # 同容器回环；勿再写 scrape-web 服务名
      SCRAPE_ORIGIN: http://127.0.0.1:9209
      SCRAPE_CONCURRENCY: "2"
      SCRAPE_DELAY_MS: "800"
      # HTTPS_PROXY: http://host.docker.internal:7890
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    dns:
      - 223.5.5.5
      - 8.8.8.8
    volumes:
      - /vol1/1000/Docker/sehuatang/data/search:/app/data
      - /vol1/1000/Docker/sehuatang/data/search-cache:/app/.next/cache
      - /vol1/1000/Docker/sehuatang/data/scrape-covers:/data/covers
      - /vol1/1000/Docker/sehuatang/data/scrape-meta:/data/meta
      - /vol1/1000/Docker/sehuatang/data/scrape-config:/data/config
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 384M

networks:
  default:
    name: sehuatang-network
    external: true
