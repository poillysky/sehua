# 主栈（无搜索）：/vol1/1000/Docker/sehuatang/
#
# 本机放：
#   docker-compose.nas.yml
#   docker-compose.search.yml   # next-web 独立
#   update.sh（可选）
#   data/postgres|backend|backups
#
# 启动主栈:
#   docker compose -f docker-compose.nas.yml pull
#   docker compose -f docker-compose.nas.yml up -d
# 访问: 管理+API :8082   （原 backend+admin 已合并为 app 单容器）
# 日志: docker logs -f sehuatang-app
#       LOG_LEVEL=DEBUG / UVICORN_LOG_LEVEL=debug 可更细

name: sehuatang

services:
  postgres:
    image: postgres:16-alpine
    container_name: sehuatang-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ed2k
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    volumes:
      - /vol1/1000/Docker/sehuatang/data/postgres:/var/lib/postgresql/data
    shm_size: 1g
    sysctls:
      - kernel.shmmax=1073741824
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ed2k"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  app:
    image: poillysky/sehuatang-app:1.2.15
    container_name: sehuatang-app
    restart: always
    ports:
      - "8082:80"
    shm_size: 2g
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ed2k
      TZ: Asia/Shanghai
      AUTH_REQUIRED: "true"
      # 可选：固定登录签名密钥。未设置时写入 /app/data/jwt_secret，随数据卷持久化。
      # JWT_SECRET: "请换成足够长的随机串"
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: admin123
      CORS_ORIGINS: ""
      WEB_CRAWLER_PROXY: ""
      SEARCH_FRONTEND_URL: http://127.0.0.1:3010
      BACKUP_DIR: /app/data/backups
      # 日志：INFO 默认；排障改为 DEBUG / debug
      LOG_LEVEL: INFO
      UVICORN_LOG_LEVEL: info
      # 主库 collector_settings 损坏时，可用环境变量强制独立资源库（跳过读设置表）:
      # RESOURCE_DB_ENABLED: "true"
      # RESOURCE_POSTGRES_HOST: "192.168.2.38"
      # RESOURCE_POSTGRES_PORT: "5435"
      # RESOURCE_POSTGRES_USER: postgres
      # RESOURCE_POSTGRES_PASSWORD: postgres
      # RESOURCE_POSTGRES_DB: ed2k
    volumes:
      - /vol1/1000/Docker/sehuatang/data/backend:/app/data
      - /vol1/1000/Docker/sehuatang/data/backups:/app/data/backups
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    name: sehuatang-network
