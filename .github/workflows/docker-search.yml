name: Build sehua-search image

# 构建 / 推送搜索合一镜像（next-web + scrape-web），与主栈 sehua 完全独立
# 触发：改 next-web / scrape-web / deploy/search / VERSION.search，或打标签 search-v*
# 手动：Actions → Build sehua-search image → Run workflow
# 注意：不会因 VERSION（主栈）或普通 v* 标签触发
on:
  push:
    branches: [main]
    paths:
      - "next-web/**"
      - "scrape-web/**"
      - "deploy/search/**"
      - "deploy/docker-compose.search.yml"
      - "VERSION.search"
      - ".dockerignore"
      - ".github/workflows/docker-search.yml"
    tags:
      - "search-v*"
      - "v*-search"
  workflow_dispatch:
    inputs:
      dockerhub_username:
        description: "Docker Hub 用户名（默认 poillysky）"
        required: false
        default: "poillysky"
      dockerhub_token:
        description: "Docker Hub Access Token（本仓库 Secrets 异常时可临时粘贴）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io
  DOCKERHUB_USER: poillysky

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read search VERSION
        id: ver
        run: |
          TAG=$(tr -d '[:space:]' < VERSION.search)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "search VERSION=$TAG"

      - name: Check Docker Hub token
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || vars.DOCKERHUB_TOKEN || vars.DOCKERHUB_PASSWORD || inputs.dockerhub_token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Token 为空。请配置 secrets.DOCKERHUB_TOKEN，或 Run workflow 时粘贴 Access Token。"
            exit 1
          fi
          echo "Token OK (length=${#TOKEN})"

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub_username || secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || vars.DOCKERHUB_TOKEN || vars.DOCKERHUB_PASSWORD || inputs.dockerhub_token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR }}/${{ github.repository_owner }}/sehuatang-search
            ${{ env.DOCKERHUB_USER }}/sehuatang-search
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/search-v') || contains(github.ref, '-search') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/search/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=search-unified
          cache-to: type=gha,mode=max,scope=search-unified
          platforms: linux/amd64
