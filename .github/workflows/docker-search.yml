name: Build sehua-search image

# 仅构建 / 推送搜索端，与主栈 sehua 完全独立
# 触发：改 next-web / VERSION.search，或打标签 search-v1.2.3
# 手动：Actions → Build sehua-search image → Run workflow
# 注意：不会因 VERSION（主栈）或普通 v* 标签触发
on:
  push:
    branches: [main]
    paths:
      - "next-web/**"
      - "VERSION.search"
      - ".github/workflows/docker-search.yml"
    tags:
      - "search-v*"
      - "v*-search"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io
  DOCKERHUB_USER: poillysky

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read search VERSION
        id: ver
        run: |
          TAG=$(tr -d '[:space:]' < VERSION.search)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "search VERSION=$TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: next-web/package-lock.json

      - name: Install & build search
        working-directory: next-web
        env:
          BUILD_MODE: standalone
          DOCKER_BUILD: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
          npm_config_registry: https://registry.npmjs.org/
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          node -e "console.log('next', require('next/package.json').version)"
          node -e "try{require('@node-rs/jieba');console.log('jieba ok')}catch(e){console.warn('jieba',e.message)}"
          NODE_ENV=production node node_modules/next/dist/bin/next build
          test -f .next/standalone/server.js
          test -d .next/static

      - name: Stage runtime context
        run: |
          mkdir -p /tmp/search-runtime/public /tmp/search-runtime/.next
          cp -a next-web/public/. /tmp/search-runtime/public/
          cp -a next-web/.next/standalone/. /tmp/search-runtime/
          mkdir -p /tmp/search-runtime/.next/static
          cp -a next-web/.next/static/. /tmp/search-runtime/.next/static/
          cp next-web/Dockerfile.runtime /tmp/search-runtime/Dockerfile
          test -f /tmp/search-runtime/server.js

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR }}/${{ github.repository_owner }}/sehuatang-search
            ${{ env.DOCKERHUB_USER }}/sehuatang-search
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/search-v') || contains(github.ref, '-search') }}

      - uses: docker/build-push-action@v6
        with:
          context: /tmp/search-runtime
          file: /tmp/search-runtime/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=search
          cache-to: type=gha,mode=max,scope=search
          platforms: linux/amd64
