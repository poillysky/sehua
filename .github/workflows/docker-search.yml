name: Build sehua-search image

# 构建 / 推送搜索合一镜像（next-web + scrape-web），与主栈 sehua 完全独立
# 触发：改 next-web / scrape-web / deploy/search / VERSION.search，或打标签 search-v*
# 手动：Actions → Build sehua-search image → Run workflow
# 注意：不会因 VERSION（主栈）或普通 v* 标签触发
on:
  push:
    branches: [main]
    paths:
      - "next-web/**"
      - "scrape-web/**"
      - "deploy/search/**"
      - "deploy/docker-compose.search.yml"
      - "VERSION.search"
      - ".github/workflows/docker-search.yml"
    tags:
      - "search-v*"
      - "v*-search"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io
  DOCKERHUB_USER: poillysky

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read search VERSION
        id: ver
        run: |
          TAG=$(tr -d '[:space:]' < VERSION.search)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "search VERSION=$TAG"

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR }}/${{ github.repository_owner }}/sehuatang-search
            ${{ env.DOCKERHUB_USER }}/sehuatang-search
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/search-v') || contains(github.ref, '-search') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/search/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=search-unified
          cache-to: type=gha,mode=max,scope=search-unified
          platforms: linux/amd64
