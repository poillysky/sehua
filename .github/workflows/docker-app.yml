name: Build sehua-app image

# 仅构建 / 推送主栈 sehua（API+管理），与 search 完全独立
# 触发：改主栈相关路径，或打标签 v1.2.22（不要用 search-v*）
# 手动：Actions → Build sehua-app image → Run workflow
# version pin: 1.2.22
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/admin/**"
      - "deploy/app/**"
      - "database/**"
      - "VERSION"
      - ".dockerignore"
      - ".github/workflows/docker-app.yml"
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io
  DOCKERHUB_USER: poillysky

jobs:
  app:
    # 排除 search 专用标签，避免误跑
    if: ${{ !startsWith(github.ref, 'refs/tags/search-v') && !contains(github.ref, '-search') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read sehua VERSION
        id: ver
        run: |
          TAG=$(tr -d '[:space:]' < VERSION)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sehua VERSION=$TAG"

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR }}/${{ github.repository_owner }}/sehuatang-app
            ${{ env.DOCKERHUB_USER }}/sehuatang-app
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          platforms: linux/amd64
