name: Build sehua-app image

# 仅构建 / 推送主栈 sehua（API+管理），与 search 完全独立
# 触发：改主栈相关路径，或打标签 v1.2.39（不要用 search-v*）
# 手动：Actions → Build sehua-app image → Run workflow（Secrets 异常时可在表单粘贴 Token）
# version pin: 1.2.39
# Hub 登录与 telegramDL 对齐：Secrets / Variables / 手动输入 多源回退
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/admin/**"
      - "deploy/app/**"
      - "database/**"
      - "VERSION"
      - ".dockerignore"
      - ".github/workflows/docker-app.yml"
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      dockerhub_username:
        description: "Docker Hub 用户名（默认 poillysky）"
        required: false
        default: "poillysky"
      dockerhub_token:
        description: "Docker Hub Access Token（本仓库 Secrets 异常时可临时粘贴）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io
  DOCKERHUB_USER: poillysky

jobs:
  app:
    # 排除 search 专用标签，避免误跑
    if: ${{ !startsWith(github.ref, 'refs/tags/search-v') && !contains(github.ref, '-search') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read sehua VERSION
        id: ver
        run: |
          TAG=$(tr -d '[:space:]' < VERSION)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sehua VERSION=$TAG"

      - name: Check Docker Hub token
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || vars.DOCKERHUB_TOKEN || vars.DOCKERHUB_PASSWORD || inputs.dockerhub_token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Token 为空。请配置 secrets.DOCKERHUB_TOKEN，或 Run workflow 时在 dockerhub_token 栏粘贴 Access Token。"
            echo "Token：https://hub.docker.com/settings/security"
            exit 1
          fi
          echo "Token OK (length=${#TOKEN})"

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub_username || secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || vars.DOCKERHUB_TOKEN || vars.DOCKERHUB_PASSWORD || inputs.dockerhub_token }}

      # 分仓推送。勿关 provenance：纯 OCI single-manifest 时
      # registry 有 tag，但 hub.docker.com 标签 API/网页常不同步（1.2.34 已验证）。
      - name: Build and push GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/app/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR }}/${{ github.repository_owner }}/sehuatang-app:${{ steps.ver.outputs.tag }}
            ${{ env.GHCR }}/${{ github.repository_owner }}/sehuatang-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          platforms: linux/amd64

      - name: Build and push Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/app/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/sehuatang-app:${{ steps.ver.outputs.tag }}
            ${{ env.DOCKERHUB_USER }}/sehuatang-app:latest
          cache-from: type=gha,scope=app
          platforms: linux/amd64

      - name: Verify Docker Hub registry tag
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          REPO="${{ env.DOCKERHUB_USER }}/sehuatang-app"
          # 以 registry-1.docker.io 为准（docker pull 实际读这里），勿只信 hub.docker.com 网页 API
          TOKEN=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${REPO}:pull" | jq -r .token)
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/reg_manifest.json -w "%{http_code}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://registry-1.docker.io/v2/${REPO}/manifests/${TAG}" || true)
            echo "registry attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::registry-1.docker.io missing ${REPO}:${TAG}"
            cat /tmp/reg_manifest.json || true
            exit 1
          fi
          echo "registry has ${REPO}:${TAG}"
          # 网页 API 仅提示，不作为失败条件
          hub=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${REPO}/tags/${TAG}/" || true)
          echo "hub.docker.com tags API -> HTTP $hub (200=网页可见；404=网页索引滞后，不影响 pull)"
