name: Build sehua-app image

# 仅构建 / 推送主栈 sehua（API+管理），与 search 完全独立
# 触发：改主栈相关路径，或打标签 v1.2.33（不要用 search-v*）
# 手动：Actions → Build sehua-app image → Run workflow
# version pin: 1.2.33
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/admin/**"
      - "deploy/app/**"
      - "database/**"
      - "VERSION"
      - ".dockerignore"
      - ".github/workflows/docker-app.yml"
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io
  DOCKERHUB_USER: poillysky

jobs:
  app:
    # 排除 search 专用标签，避免误跑
    if: ${{ !startsWith(github.ref, 'refs/tags/search-v') && !contains(github.ref, '-search') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read sehua VERSION
        id: ver
        run: |
          TAG=$(tr -d '[:space:]' < VERSION)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sehua VERSION=$TAG"

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR }}/${{ github.repository_owner }}/sehuatang-app
            ${{ env.DOCKERHUB_USER }}/sehuatang-app
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Show image tags
        run: |
          echo "sehua VERSION=${{ steps.ver.outputs.tag }}"
          echo "tags:"
          printf '%s\n' "${{ steps.meta.outputs.tags }}"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/app/Dockerfile
          push: true
          # multi-registry + 默认 provenance 偶发只落到 GHCR；Hub 无新 tag
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          platforms: linux/amd64

      - name: Verify Docker Hub tag
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          URL="https://hub.docker.com/v2/repositories/${{ env.DOCKERHUB_USER }}/sehuatang-app/tags/${TAG}/"
          echo "verify $URL"
          ok=0
          for i in $(seq 1 18); do
            code=$(curl -sS -o /tmp/hub_tag.json -w "%{http_code}" "$URL" || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Docker Hub missing tag ${TAG} (Actions push reported ok but Hub 404). Check DOCKERHUB_TOKEN write scope."
            cat /tmp/hub_tag.json || true
            exit 1
          fi
          echo "Docker Hub has ${TAG}"
